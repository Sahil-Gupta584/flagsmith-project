# yaml-language-server: $schema=https://cdn.jsdelivr.net/gh/Sahil-Gupta584/flagsmith-project@main/flagsmith.schema.json
# Flagsmith GitOps Manifest
version: 1
project:
  id: 1042
  name: "B2B SaaS Platform"

flags:
  - key: maintenance_mode
    description: "Emergency kill-switch: Displays a maintenance banner and blocks writes"
    type: STANDARD
    default_enabled: false
    value: null
    variants: []
    environments:
      - name: Production
        enabled: false
      - name: Development
        enabled: false
    archived: false

  - key: email_verification_required
    description: "Require new users to verify their email before accessing the workspace"
    type: STANDARD
    default_enabled: true
    value: null
    variants: []
    environments:
      - name: Production
        enabled: true
      - name: Development
        enabled: true
    archived: false

  - key: team_invites_enabled
    description: "Allow workspace admins to invite teammates"
    type: STANDARD
    default_enabled: true
    value: null
    variants: []
    environments:
      - name: Production
        enabled: true
      - name: Development
        enabled: true
    archived: false

  - key: api_rate_limit_rpm
    description: "Remote config: Maximum API requests per minute allowed per tenant"
    type: STANDARD
    default_enabled: true
    value: 120
    variants: []
    environments:
      - name: Production
        enabled: true
        value: 600
      - name: Development
        enabled: true
        value: 120
    archived: false

  - key: sso_enabled
    description: "Enterprise Single Sign-On (SAML/OIDC) login"
    type: STANDARD
    default_enabled: false
    value: null
    variants: []
    environments:
      - name: Production
        enabled: false
      - name: Development
        enabled: true
    archived: false

  - key: onboarding_checklist
    description: "User activation: Step-by-step onboarding checklist for new accounts"
    type: STANDARD
    default_enabled: true
    value: null
    variants: []
    environments:
      - name: Production
        enabled: true
      - name: Development
        enabled: true
    archived: false

  - key: hero_headline
    description: "Landing page A/B experiment: control headline vs a benefit-led headline"
    type: MULTIVARIATE
    default_enabled: true
    value: "Ship features faster"
    target_metric:
      name: signup_completed
      description: "Visitor completed account signup"
      aggregation: occurrence
      direction: up
    variants:
      - value: "Launch with confidence"
        percentage: 50
    environments:
      - name: Production
        enabled: true
      - name: Development
        enabled: true
    archived: false
