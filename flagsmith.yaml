# Run "fm diff" to preview or "fm apply" to push changes

version: 1
project:
  id: 53999
  name: Screenly
flags:
  - key: default_llm_model
    description: Traffic split across foundation models (Cost, latency & fallback routing)
    type: MULTIVARIATE
    default_enabled: true
    value: gemini-2.0-flash
    variants:
      - value: gemini-2.0-flash
        percentage: 70
      - value: gpt-4o-mini
        percentage: 30
    target_metric:
      name: time_to_first_token_ms
      description: Streaming response latency in milliseconds (Lower is better)
      aggregation: mean
      direction: down
    environments:
      Production:
        enabled: true
        value: gemini-2.0-flash
      Development:
        enabled: true
        value: gemini-2.0-flash
    archived: false
  - key: max_tokens_limit
    description: "Financial circuit breaker: Maximum completion tokens allowed per prompt"
    type: STANDARD
    default_enabled: true
    value: 2048
    variants: []
    environments:
      Production:
        enabled: true
        value: 4096
      Development:
        enabled: true
        value: 1024
    archived: false
  - key: enable_web_search_tool
    description: "Agent tool kill-switch: Allows LLM to call live Google search API"
    type: STANDARD
    default_enabled: false
    value: null
    variants: []
    environments:
      Production:
        enabled: false
        value: null
      Development:
        enabled: true
        value: null
    archived: false
  - key: streaming_enabled
    description: Server-Sent Events (SSE) streaming; fallback to buffered for
      enterprise proxies
    type: STANDARD
    default_enabled: true
    value: null
    variants: []
    environments:
      Production:
        enabled: true
        value: null
      Development:
        enabled: true
        value: null
    archived: false
  - key: rag_top_k_chunks
    description: "Vector DB retrieval: Number of document chunks injected into
      prompt context"
    type: STANDARD
    default_enabled: true
    value: 3
    variants: []
    environments:
      Production:
        enabled: true
        value: 6
      Development:
        enabled: true
        value: 3
    archived: false
  - key: prompt_template_version
    description: "Remote config: Active system prompt version for instant
      hallucination rollbacks"
    type: STANDARD
    default_enabled: true
    value: v2.1
    variants: []
    environments:
      Production:
        enabled: true
        value: v2.1
      Development:
        enabled: true
        value: v2.2-rc
    archived: false
